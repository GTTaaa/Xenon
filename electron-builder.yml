appId: com.electron.app
productName: Xenon
directories:
  buildResources: build
files:
  # 仅打包运行所需的构建产物与原生资源，避免演示素材进入安装包
  - 'out/**/*'
  - 'resources/**/*'
asarUnpack:
  # 仅 OCR 可执行文件需要脱离 asar，图片资源可直接从归档读取
  - resources/bin/**
win:
  executableName: Xenon
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 指向 Icon Composer 制作的 .icon 文件（需要 macOS 26 + Xcode 26 打包）
  icon: build/AppIcon.icon
  entitlementsInherit: build/entitlements.mac.plist
  # 仅保留界面实际支持的语言，减少 Chromium 语言资源占用
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
  # 本地构建不依赖苹果时间戳服务；正式分发时需恢复时间戳并启用公证
  timestamp: none
  extendInfo:
    # 截图 OCR 需要屏幕录制权限；本应用不使用摄像头/麦克风，也不访问文档/下载目录
    - NSScreenCaptureUsageDescription: Xenon 需要「屏幕录制」权限以截取屏幕内容并进行文字识别。
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
